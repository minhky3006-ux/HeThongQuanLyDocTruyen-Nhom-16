<!doctype html>
<html lang="vi">
  <head>

    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>TruyệnXanh</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; background: #f2f8f1; color: #1f3a2b; text-align: center; padding: 24px; box-sizing: border-box; }
      h1 { font-size: 1.3rem; margin: 0 0 8px; }
      p { margin: 0 0 18px; color: #4d6b5a; }

    </style>
  </head>
  <body>
    <div>
      <h1>Không kết nối được TruyệnXanh</h1>
      <p>Hãy kiểm tra mạng rồi thử lại.</p>
      <button onclick="history.length > 1 ? history.back() : location.reload()">Thử lại</button>
    </div>
  </body>
</html>
