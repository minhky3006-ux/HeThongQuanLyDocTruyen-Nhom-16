<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#46B07A" />
    <link rel="manifest" href="../../manifest.json" />
    <title>Đăng nhập · TruyệnXanh</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="../../assets/css/style.css" />
  </head>
  <body data-page="login" data-root="../../">
    <main class="container">
      <form class="card narrow" id="f">
        <h1 style="margin-bottom: 16px">Đăng nhập</h1>
        <div class="field">
          <label for="email">Email</label
          ><input id="email" type="email" class="input" required autocomplete="email" />
        </div>
        <div class="field">
          <label for="pw">Mật khẩu</label
          ><input id="pw" type="password" class="input" required autocomplete="current-password" />
        </div>
        <button class="btn block">Đăng nhập</button>
        <p class="msg" id="msg" hidden role="alert"></p>
        <p style="text-align: center; margin-top: 14px; font-size: 0.9rem">
          Chưa có tài khoản?
          <a href="register.html" style="color: var(--primary-dark); font-weight: 600">Đăng ký</a>
        </p>
      </form>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../assets/js/config.js"></script>
    <script src="../../assets/js/api.js"></script>
    <script src="../../assets/js/ui.js"></script>
    <script src="../../assets/js/layout.js"></script>
    <script>
      $("f").onsubmit = async (e) => {
        e.preventDefault();
        const b = $("f").querySelector("button");
        b.disabled = true;
        try {
          await API.signIn($("email").value.trim(), $("pw").value);
          goNext(ROOT + "index.html");
        } catch (err) {
          showMsg($("msg"), err.message);
          b.disabled = false;
        }
      };
    </script>
  </body>
</html>
