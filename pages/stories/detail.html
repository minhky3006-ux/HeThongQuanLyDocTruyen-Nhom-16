<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#46B07A" />
    <link rel="manifest" href="../../manifest.json" />
    <link rel="apple-touch-icon" href="../../assets/img/icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="TruyệnXanh" />
    <title>Chi tiết truyện · TruyệnXanh</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="../../assets/css/style.css" />
  </head>
  <body data-page="stories" data-root="../../">
    <main class="container">
      <div id="box" class="card" style="margin-top: 20px">Đang tải...</div>
      <h2>Danh sách chương</h2>
      <div class="chapters card" id="chs"></div>
      <h2>Đánh giá</h2>
      <div class="card" id="rate"></div>
      <p class="muted" style="margin-top: 16px">Bình luận và thảo luận nằm ở từng chương: mở một chương để tham gia.</p>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../assets/js/config.js"></script>
    <script src="../../assets/js/api.js"></script>
    <script src="../../assets/js/ui.js"></script>
    <script src="../../assets/js/layout.js"></script>
    <script>
      const toLogin = () =>
        (location.href = "../auth/login.html?next=" + encodeURIComponent(location.pathname + location.search));

      async function setupRating(id, u) {
        const box = $("rate");
        let mine = u ? await API.myRating(id).catch(() => 0) : 0;
        const paint = () => {
          box.innerHTML = `<p class="rate-stars">${[1, 2, 3, 4, 5]
            .map((n) => `<button data-n="${n}" class="${n <= mine ? "on" : ""}" aria-label="${n} sao">★</button>`)
            .join("")}</p><p class="muted" style="font-size:.85rem">${mine ? "Bạn đã đánh giá " + mine + " sao. Bấm sao khác để đổi." : u ? "Bấm vào sao để đánh giá truyện." : "Đăng nhập để đánh giá truyện."}</p><p class="msg" id="rm" hidden role="alert"></p>`;
        };
        paint();
        box.onclick = async (e) => {
          const b = e.target.closest("button[data-n]");
          if (!b) return;
          if (!u) return toLogin();
          try {
            await API.rate(id, +b.dataset.n);
            mine = +b.dataset.n;
            paint();
          } catch (err) {
            showMsg($("rm"), err.message);
          }
        };
      }

      (async () => {
        const id = +new URLSearchParams(location.search).get("id");
        try {
          const [s, chs, u] = await Promise.all([API.getStory(id), API.listChapters(id), API.currentUser()]);
          document.title = s.title + " · TruyệnXanh";
          let following = false,
            resume = null,
            unlocked = false; // người xem đã có gói/mua lẻ -> hiện "Đã mở khóa"
          let access = null; // nguồn quyền đọc (gói / mua lẻ / cả hai)
          if (u && s.access_policy !== "free") {
            access = await API.myStoryAccess(id).catch(() => null);
            unlocked = !!(access && (access.purchased || access.subscription));
          }
          // khung quyền đọc. Đã có quyền thì KHÔNG hiện nút mua (tránh thanh toán lại).
          const here = encodeURIComponent(location.pathname + location.search);
          const accessBox =
            s.access_policy === "free"
              ? ""
              : unlocked
                ? `<p class="card" style="padding:10px 14px;margin-top:8px">🔓 ${accessSourceText(access)}</p>`
                : `<p class="row" style="margin-top:8px">${s.price ? `<a class="btn" href="../member/checkout.html?story=${id}">Mua truyện ${vnd(s.price)}</a>` : ""}<a class="btn ghost" href="../member/checkout.html?back=${here}">Xem các gói đọc</a></p>`;
          if (u) {
            [following, resume] = await Promise.all([API.isFollowing(id), API.getResume(id)]);
          }
          const startNum = resume?.chapters?.number || chs[0]?.number;
          $("box").innerHTML =
            `<div class="row" style="align-items:flex-start"><div style="width:130px">${coverHTML(s, true)}</div>
      <div style="flex:1;min-width:200px"><h1>${esc(s.title)}</h1>
      <p class="muted">${esc(s.author)} · ${s.rating_count ? "★ " + Number(s.rating_avg).toFixed(1) + " (" + s.rating_count + ")" : "Chưa có đánh giá"} · ${fmt(s.view_count)} lượt đọc</p>
      <p style="margin:8px 0"><span class="badge ${s.access_policy === "free" ? "" : "lock"}">${esc(ACCESS_VI[s.access_policy] || "Miễn phí")}</span> <span class="badge">${esc(PROGRESS_VI[s.progress] || "Đang ra")}</span> ${s.genres.map((g) => `<span class="chip">${esc(g.name)}</span>`).join("")}</p><p>${esc(s.description)}</p>${accessBox}
      <p class="row" style="margin-top:14px">${startNum ? `<a class="btn" href="reader.html?id=${id}&ch=${startNum}">${resume ? "Đọc tiếp chương " : "Đọc từ chương "}${startNum}</a>` : ""}
      <button class="btn ghost" id="fol"></button></p><p class="msg" id="fm" hidden role="alert"></p></div></div>`;
          const paint = () => {
            $("fol").textContent = following ? "♥ Đang theo dõi" : "♡ Theo dõi";
          };
          paint();
          $("fol").onclick = async () => {
            if (!u) {
              location.href =
                "../auth/login.html?next=" + encodeURIComponent(location.pathname + location.search);
              return;
            }
            try {
              following = await API.toggleFollow(id);
              paint();
            } catch (e) {
              showMsg($("fm"), e.message);
            }
          };
          // thứ tự chương + nhãn Miễn phí / Trả phí / Đã mở khóa (accessBadge trong ui.js).
          $("chs").innerHTML =
            chs
              .map(
                (c) =>
                  `<a href="reader.html?id=${id}&ch=${c.number}"><span>Chương ${c.number}${c.title ? ": " + esc(c.title) : ""}${accessBadge(s, c, unlocked)}</span><span class="muted">›</span></a>`,
              )
              .join("") || emptyHTML("Truyện chưa có chương nào.");
          setupRating(id, u);
        } catch (e) {
          showError($("box"), e);
        }
      })();
    </script>
  </body>
</html>
