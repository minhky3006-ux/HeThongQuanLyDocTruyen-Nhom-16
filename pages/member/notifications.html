<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#46B07A" />
    <link rel="manifest" href="../../manifest.json" />
    <link rel="apple-touch-icon" href="../../assets/img/icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="TruyệnXanh" />
    <title>Thông báo · TruyệnXanh</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="../../assets/css/style.css" />
  </head>
  <body data-page="notifications" data-root="../../">
    <main class="container narrow">
      <h1 style="margin-top: 20px">Thông báo</h1>
      <div id="gate"></div>
      <div id="app" hidden>
        <p class="row" style="justify-content: space-between; margin: 8px 0"><span class="muted" id="sum"></span><button class="btn ghost sm" id="all">Đánh dấu tất cả đã đọc</button></p>
        <div class="card" id="list"></div>
        <p class="row" style="justify-content: center; margin-top: 12px"><button class="btn ghost sm" id="more" hidden>Xem thêm</button></p>
      </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../assets/js/config.js"></script>
    <script src="../../assets/js/api.js"></script>
    <script src="../../assets/js/ui.js"></script>
    <script src="../../assets/js/layout.js"></script>
    <script>
      (async () => {
        if (!(await API.currentUser())) {
          $("gate").innerHTML = `<div class="empty"><p>Bạn cần đăng nhập để xem thông báo.</p><p><a class="btn" href="../auth/login.html?next=${encodeURIComponent(location.pathname)}">Đăng nhập</a></p></div>`;
          return;
        }
        $("app").hidden = false;
        let page = 0;
        const items = new Map();
        const row = (n) =>
          `<a class="list-row ${n.read_at ? "" : "unread"}" href="../stories/reader.html?id=${n.story_id}&ch=${n.chapter_number}" data-id="${n.id}"><span><strong>${esc(n.story_title)}</strong> có chương mới<br><span class="muted" style="font-size:.85rem">Chương ${n.chapter_number}${n.chapter_title ? ": " + esc(n.chapter_title) : ""} · ${fmtDateTime(n.created_at)}</span></span><span class="muted">›</span></a>`;
        const paintSum = () => {
          const un = [...items.values()].filter((n) => !n.read_at).length;
          $("sum").textContent = un ? `${un} thông báo chưa đọc` : "Bạn đã đọc hết thông báo";
        };
        async function load(reset) {
          if (reset) {
            page = 0;
            $("list").innerHTML = "";
            items.clear();
          }
          try {
            const ns = await API.listNotifications(page);
            ns.forEach((n) => items.set(n.id, n));
            $("list").insertAdjacentHTML("beforeend", ns.map(row).join(""));
            if (!$("list").children.length)
              $("list").innerHTML = emptyHTML("Chưa có thông báo. Hãy theo dõi truyện để nhận thông báo khi có chương mới.");
            $("more").hidden = ns.length < API.PAGE;
            paintSum();
          } catch (e) {
            showError($("list"), e);
          }
        }
        // Bấm vào thông báo: đánh dấu đã đọc (không chặn việc chuyển trang)
        $("list").onclick = (e) => {
          const a = e.target.closest("a[data-id]");
          if (a && items.get(+a.dataset.id)?.read_at === null) API.markNotificationsRead([+a.dataset.id]).catch(() => {});
        };
        $("all").onclick = async () => {
          try {
            await API.markNotificationsRead();
            document.querySelectorAll(".bell-badge").forEach((b) => (b.hidden = true));
            load(true);
          } catch (e) {
            showError($("list"), e);
          }
        };
        $("more").onclick = () => {
          page++;
          load();
        };
        load(true);
      })();
    </script>
  </body>
</html>
