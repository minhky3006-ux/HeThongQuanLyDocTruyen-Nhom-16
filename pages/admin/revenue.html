<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#46B07A" />
    <link rel="manifest" href="../../manifest.json" />
    <link rel="apple-touch-icon" href="../../assets/img/icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="TruyệnXanh" />
    <title>Doanh thu · TruyệnXanh</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="../../assets/css/style.css" />
  </head>
  <body data-page="admin" data-root="../../">
    <main class="container">
      <h1 style="margin-top: 20px">Doanh thu</h1>
      <div id="gate"></div>
      <div id="app" hidden>
        <div class="tabs" id="tabs"><button data-t="plans" class="on">Gói đọc</button><button data-t="stories">Theo truyện</button></div>
        <form class="row" id="f" style="margin: 12px 0; align-items: flex-end">
          <div class="field"><label for="from">Từ ngày</label><input id="from" class="input" type="date" required /></div>
          <div class="field"><label for="to">Đến ngày</label><input id="to" class="input" type="date" required /></div>
          <div class="field"><label for="g">Nhóm theo</label><select id="g" class="input"><option value="day">Ngày</option><option value="month">Tháng</option></select></div>
          <button class="btn">Xem</button>
          <button type="button" class="btn ghost" id="csv">Xuất CSV</button>
        </form>
        <p class="row" style="margin: 0 0 8px"><button class="btn ghost sm" data-p="7">7 ngày</button><button class="btn ghost sm" data-p="30">30 ngày</button><button class="btn ghost sm" data-p="90">90 ngày</button><button class="btn ghost sm" data-p="m">Tháng này</button></p>
        <p class="msg" id="m" hidden role="alert"></p>
        <div class="stat-grid" id="tot"></div>
        <div id="filter" class="row" style="margin-bottom: 8px" hidden></div>
        <h2>Theo thời gian</h2>
        <div class="card" id="series"></div>
        <h2 id="h2b">Theo gói</h2>
        <div class="card" id="table"></div>
        <p class="muted" style="font-size: 0.85rem; margin-top: 8px">
          Doanh thu = tổng đơn đã thanh toán, tính theo ngày thanh toán (giờ Việt Nam). Hệ thống chưa ghi nhận hoàn tiền nên đây là doanh thu gộp.
        </p>
      </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../assets/js/config.js"></script>
    <script src="../../assets/js/api.js"></script>
    <script src="../../assets/js/ui.js"></script>
    <script src="../../assets/js/layout.js"></script>
    <script src="../../assets/js/admin.js"></script>
    <script>
      const SERIES_COLORS = ["#46B07A", "#2f80ed", "#f2994a", "#9b51e0", "#eb5757", "#56ccf2", "#bb6bd9", "#6fcf97"];
      let tab = "plans",
        storyId = null,
        last = null;
      (async () => {
        if (!(await requireAdmin("revenue"))) return;
        $("app").hidden = false;
        const setRange = (days) => {
          const t = new Date();
          $("to").value = isoDay(t);
          $("from").value = days === "m" ? isoDay(new Date(t.getFullYear(), t.getMonth(), 1)) : isoDay(new Date(t.getTime() - (days - 1) * 864e5));
        };
        setRange(30);
        const lab = (p) => (last?.range?.group === "month" ? String(p).slice(0, 7) : fmtDay(p));
        const card = (n, t) => `<div class="card"><b>${n}</b>${t}</div>`;
        function paintPlans(r) {
          const t = r.totals;
          $("tot").innerHTML = card(vnd(t.revenue), "Doanh thu gói đọc") + card(t.orders, "Lượt mua gói") + card(t.buyers, "Người mua") + card(vnd(t.avg_order), "Giá trị trung bình/đơn");
          const colorOf = new Map(r.by_plan.map((p, i) => [String(p.plan_id), SERIES_COLORS[i % SERIES_COLORS.length]]));
          const max = Math.max(1, ...r.series.map((x) => x.revenue));
          $("series").innerHTML =
            r.series
              .map((x) => {
                const segs = Object.entries(x.by_plan).map(([id, v]) => `<div title="${esc(r.by_plan.find((p) => String(p.plan_id) === id)?.name || id)}: ${vnd(v)}" style="height:10px;width:${(v / max) * 100}%;background:${colorOf.get(id) || "#999"}"></div>`).join("");
                return `<div class="list-row" style="align-items:center"><span style="min-width:90px"><b>${lab(x.period)}</b></span><span style="flex:1;min-width:160px;display:flex;border-radius:5px;overflow:hidden">${segs || '<div style="height:10px"></div>'}</span><span class="muted" style="min-width:110px;text-align:right;font-size:.85rem">${x.revenue ? vnd(x.revenue) : "—"}</span></div>`;
              })
              .join("") +
            `<p class="muted" style="font-size:.85rem;margin-top:8px">${r.by_plan.map((p, i) => `<span class="bar" style="display:inline-block;width:14px;height:10px;background:${SERIES_COLORS[i % SERIES_COLORS.length]}"></span> ${esc(p.name)}`).join(" · ")}</p>`;
          $("h2b").textContent = "Theo gói";
          $("table").innerHTML =
            r.by_plan
              .map((p) => `<div class="list-row"><span><strong>${esc(p.name)}</strong>${p.is_active ? "" : ' <span class="badge warn">Ngừng bán</span>'}<br><span class="muted" style="font-size:.85rem">${p.orders} lượt mua · ${p.buyers} người · giá hiện tại ${vnd(p.price)}</span></span><span><b>${vnd(p.revenue)}</b><br><span class="muted" style="font-size:.85rem">${t.revenue ? Math.round((p.revenue / t.revenue) * 100) : 0}%</span></span></div>`)
              .join("") || emptyHTML("Chưa có gói nào.");
        }
        function paintStories(r) {
          const t = r.totals;
          $("tot").innerHTML = card(vnd(t.revenue), "Doanh thu mua lẻ") + card(t.purchases, "Lượt mua") + card(t.buyers, "Người mua") + card(t.stories, "Truyện có người mua");
          const max = Math.max(1, ...r.series.map((x) => x.revenue));
          $("series").innerHTML = r.series
            .map((x) => `<div class="list-row" style="align-items:center"><span style="min-width:90px"><b>${lab(x.period)}</b></span><span style="flex:1;min-width:160px"><div class="bar" style="width:${(x.revenue / max) * 100}%"></div></span><span class="muted" style="min-width:150px;text-align:right;font-size:.85rem">${x.purchases ? x.purchases + " lượt · " + vnd(x.revenue) : "—"}</span></span></div>`)
            .join("");
          $("h2b").textContent = storyId ? "Truyện đang xem" : "Theo truyện (xếp theo doanh thu)";
          $("table").innerHTML =
            r.top
              .map((s) => `<div class="list-row"><span><strong>${esc(s.title)}</strong><br><span class="muted" style="font-size:.85rem">${s.purchases} lượt mua · ${s.buyers} người · giá hiện tại ${s.price ? vnd(s.price) : "chưa đặt"}</span></span><span class="row"><b>${vnd(s.revenue)}</b>${storyId ? "" : `<button class="btn ghost sm" data-s="${s.story_id}">Xem theo thời gian</button>`}</span></div>`)
              .join("") || emptyHTML("Chưa có lượt mua lẻ nào trong khoảng này.");
          $("filter").hidden = !storyId;
          $("filter").innerHTML = storyId ? `<span class="badge">Đang lọc: ${esc(r.top[0]?.title || "truyện #" + storyId)}</span><button class="btn ghost sm" id="all">Xem tất cả truyện</button>` : "";
        }
        async function load() {
          $("m").hidden = true;
          try {
            last = tab === "plans" ? await API.adminRevenuePlans($("from").value, $("to").value, $("g").value) : await API.adminRevenueStories($("from").value, $("to").value, $("g").value, storyId);
            tab === "plans" ? paintPlans(last) : paintStories(last);
          } catch (e) {
            showMsg($("m"), e.message);
          }
        }
        $("tabs").onclick = (e) => {
          const b = e.target.closest("button[data-t]");
          if (!b) return;
          tab = b.dataset.t;
          storyId = null;
          $("filter").hidden = true;
          document.querySelectorAll("#tabs button").forEach((x) => x.classList.toggle("on", x === b));
          load();
        };
        $("f").onsubmit = (e) => {
          e.preventDefault();
          load();
        };
        document.querySelector("p.row").onclick = (e) => {
          const b = e.target.closest("button[data-p]");
          if (!b) return;
          setRange(b.dataset.p === "m" ? "m" : +b.dataset.p);
          load();
        };
        $("table").onclick = (e) => {
          const b = e.target.closest("button[data-s]");
          if (!b) return;
          storyId = +b.dataset.s;
          load();
        };
        $("filter").onclick = (e) => {
          if (e.target.id === "all") {
            storyId = null;
            load();
          }
        };
        $("csv").onclick = () => {
          if (!last) return;
          if (tab === "plans") {
            const names = last.by_plan.map((p) => p.name);
            downloadCSV(`doanh-thu-goi_${$("from").value}_${$("to").value}.csv`, [["Mốc", "Doanh thu", "Số đơn", ...names], ...last.series.map((x) => [x.period, x.revenue, x.orders, ...last.by_plan.map((p) => x.by_plan[String(p.plan_id)] || 0)])]);
          } else
            downloadCSV(`doanh-thu-truyen_${$("from").value}_${$("to").value}.csv`, [["Truyện", "Lượt mua", "Người mua", "Doanh thu", "Giá hiện tại"], ...last.top.map((s) => [s.title, s.purchases, s.buyers, s.revenue, s.price ?? ""])]);
        };
        load();
      })();
    </script>
  </body>
</html>
