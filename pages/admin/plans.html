<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#46B07A" />
    <link rel="manifest" href="../../manifest.json" />
    <link rel="apple-touch-icon" href="../../assets/img/icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="TruyệnXanh" />
    <title>Gói đọc · TruyệnXanh</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="../../assets/css/style.css" />
  </head>
  <body data-page="admin" data-root="../../">
    <main class="container">
      <h1 style="margin-top: 20px">Gói đọc theo tháng</h1>
      <div id="gate"></div>
      <div id="app" hidden>
        <p class="row" style="margin: 12px 0"><button class="btn" id="add">+ Thêm gói</button></p>
        <form class="card" id="pf" hidden>
          <h2 id="ph" style="margin-top: 0">Thêm gói</h2>
          <div class="field"><label for="pn">Tên gói</label><input id="pn" class="input" maxlength="80" required /></div>
          <div class="field"><label for="pd">Mô tả</label><textarea id="pd" class="input" rows="2" maxlength="300"></textarea></div>
          <div class="row">
            <div class="field" style="flex: 1; min-width: 150px"><label for="pp">Mức phí (₫)</label><input id="pp" class="input" type="number" min="1000" step="1000" required /></div>
            <div class="field" style="flex: 1; min-width: 150px"><label for="pt">Thời hạn (ngày)</label><input id="pt" class="input" type="number" min="1" max="3660" value="30" required /></div>
            <div class="field" style="flex: 1; min-width: 180px">
              <label for="ps">Phạm vi</label>
              <select id="ps" class="input"><option value="all">Mọi truyện trả phí</option><option value="selected">Chỉ truyện được chọn</option></select>
            </div>
          </div>
          <div id="sel" hidden>
            <p class="muted" style="margin: 4px 0">Truyện thuộc phạm vi gói:</p>
            <p id="chosen"></p>
            <input id="sq" class="input" type="search" placeholder="Tìm truyện để thêm vào gói" />
            <div id="found" style="margin-top: 8px"></div>
          </div>
          <p class="row" style="margin-top: 12px"><button class="btn" id="save">Lưu gói</button><button type="button" class="btn ghost" id="cancel">Hủy</button></p>
        </form>
        <p class="msg" id="m" hidden role="alert"></p>
        <div class="plan-grid" id="list"></div>
      </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../assets/js/config.js"></script>
    <script src="../../assets/js/api.js"></script>
    <script src="../../assets/js/ui.js"></script>
    <script src="../../assets/js/layout.js"></script>
    <script src="../../assets/js/admin.js"></script>
    <script>
      (async () => {
        if (!(await requireAdmin("plans"))) return;
        $("app").hidden = false;
        let plans = [],
          editing = null,
          timer;
        const chosen = new Map(); // id truyện -> tên, dùng khi phạm vi = "chọn truyện"

        const cardHTML2 = (p) =>
          `<div class="card plan-card ${p.is_active ? "" : "off"}"><b class="price">${vnd(p.price)}</b><h3>${esc(p.name)}</h3>
          <p class="muted">${p.duration_days} ngày · ${p.scope === "all" ? "Mọi truyện trả phí" : p.plan_stories.length + " truyện chọn lọc"}${p.is_active ? "" : ' · <span class="badge warn">Ngừng bán</span>'}</p>
          <p>${esc(p.description || "")}</p>
          <p class="row" style="margin-top:8px"><button class="btn sm ghost" data-e="${p.id}">Sửa</button><button class="btn sm ghost" data-t="${p.id}">${p.is_active ? "Ngừng bán" : "Mở bán lại"}</button><button class="btn sm danger" data-d="${p.id}">Xóa</button></p></div>`;

        async function load() {
          try {
            plans = await API.adminListPlans();
            $("list").innerHTML = plans.map(cardHTML2).join("") || emptyHTML("Chưa có gói nào. Bấm \"Thêm gói\" để tạo.");
          } catch (e) {
            showError($("list"), e);
          }
        }
        const paintChosen = () => {
          $("chosen").innerHTML =
            [...chosen]
              .map(([id, t]) => `<button type="button" class="chip" data-rm="${id}" style="border:0;cursor:pointer">${esc(t)} ✕</button>`)
              .join(" ") || '<span class="muted">Chưa chọn truyện nào.</span>';
        };
        function openForm(p) {
          editing = p;
          $("ph").textContent = p ? "Sửa gói" : "Thêm gói";
          $("pn").value = p?.name || "";
          $("pd").value = p?.description || "";
          $("pp").value = p?.price || "";
          $("pt").value = p?.duration_days || 30;
          $("ps").value = p?.scope || "all";
          chosen.clear();
          (p?.plan_stories || []).forEach((x) => chosen.set(x.story_id, x.stories?.title || "Truyện #" + x.story_id));
          paintChosen();
          $("sel").hidden = $("ps").value !== "selected";
          $("found").innerHTML = "";
          $("sq").value = "";
          $("m").hidden = true;
          $("pf").hidden = false;
          $("pn").focus();
        }
        $("add").onclick = () => openForm(null);
        $("cancel").onclick = () => ($("pf").hidden = true);
        $("ps").onchange = () => ($("sel").hidden = $("ps").value !== "selected");
        $("chosen").onclick = (e) => {
          const b = e.target.closest("button[data-rm]");
          if (!b) return;
          chosen.delete(+b.dataset.rm);
          paintChosen();
        };
        // Tìm truyện để thêm vào phạm vi gói (dùng lại API.listStories)
        $("sq").oninput = () => {
          clearTimeout(timer);
          timer = setTimeout(async () => {
            const k = $("sq").value.trim();
            if (!k) return ($("found").innerHTML = "");
            try {
              const r = await API.listStories({ q: k });
              $("found").innerHTML =
                r.items
                  .slice(0, 8)
                  .map((s) => `<button type="button" class="btn sm ghost" data-add="${s.id}" data-t="${esc(s.title)}" style="margin:0 6px 6px 0">+ ${esc(s.title)}</button>`)
                  .join("") || emptyHTML("Không tìm thấy truyện.");
            } catch (e) {
              showError($("found"), e);
            }
          }, 300);
        };
        $("found").onclick = (e) => {
          const b = e.target.closest("button[data-add]");
          if (!b) return;
          chosen.set(+b.dataset.add, b.dataset.t);
          paintChosen();
        };
        $("pf").onsubmit = async (e) => {
          e.preventDefault();
          const scope = $("ps").value;
          if (scope === "selected" && !chosen.size) return showMsg($("m"), "Hãy chọn ít nhất 1 truyện cho gói này.");
          $("save").disabled = true;
          try {
            await API.savePlan(
              { id: editing?.id, name: $("pn").value, description: $("pd").value.trim(), price: $("pp").value, duration_days: $("pt").value, scope },
              [...chosen.keys()],
            );
            $("pf").hidden = true;
            showMsg($("m"), "Đã lưu gói.", true);
            load();
          } catch (err) {
            showMsg($("m"), err.message);
          } finally {
            $("save").disabled = false;
          }
        };
        $("list").onclick = async (e) => {
          const b = e.target.closest("button");
          if (!b) return;
          try {
            if (b.dataset.e) openForm(plans.find((p) => p.id === +b.dataset.e));
            else if (b.dataset.t) {
              const p = plans.find((x) => x.id === +b.dataset.t);
              await API.setPlanActive(p.id, !p.is_active);
              load();
            } else if (b.dataset.d && confirm("Xóa gói này? Gói đã có người mua không xóa được, hãy chọn Ngừng bán.")) {
              await API.deletePlan(+b.dataset.d);
              load();
            }
          } catch (err) {
            showMsg($("m"), err.message);
          }
        };
        load();
      })();
    </script>
  </body>
</html>
