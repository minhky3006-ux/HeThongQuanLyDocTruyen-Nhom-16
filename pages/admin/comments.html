<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#46B07A" />
    <link rel="manifest" href="../../manifest.json" />
    <link rel="apple-touch-icon" href="../../assets/img/icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="TruyệnXanh" />
    <title>Kiểm duyệt bình luận · TruyệnXanh</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="../../assets/css/style.css" />
  </head>
  <body data-page="admin" data-root="../../">
    <main class="container">
      <h1 style="margin-top: 20px">Kiểm duyệt bình luận</h1>
      <div id="gate"></div>
      <div class="tabs" id="tabs" hidden>
        <button data-h="auto" class="on">Tự động ẩn (chờ duyệt)</button><button data-h="visible">Đang hiển thị</button
        ><button data-h="hidden">Tất cả đã ẩn</button>
      </div>
      <p class="row" id="sb" hidden style="margin: 8px 0">
        <input class="input" id="q" placeholder="Tìm trong nội dung bình luận..." maxlength="100" style="max-width: 320px" />
        <a class="btn ghost sm" href="banned-words.html">Quản lý từ khóa cấm</a>
      </p>
      <div class="card" id="list" hidden></div>
      <div class="row" id="pg" style="justify-content: center; margin-top: 12px" hidden>
        <button class="btn ghost sm" id="prev">‹ Trước</button><span id="pn" class="muted"></span
        ><button class="btn ghost sm" id="next">Sau ›</button>
      </div>
      <p class="msg" id="m" hidden role="alert"></p>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../assets/js/config.js"></script>
    <script src="../../assets/js/api.js"></script>
    <script src="../../assets/js/ui.js"></script>
    <script src="../../assets/js/layout.js"></script>
    <script src="../../assets/js/admin.js"></script>
    <script>
      let mode = "auto",
        page = 0,
        q = "";
      (async () => {
        if (!(await requireAdmin("comments"))) return;
        $("tabs").hidden = false;
        $("sb").hidden = false;
        $("list").hidden = false;
        async function load() {
          $("list").innerHTML = "Đang tải...";
          try {
            const cs = await API.adminComments(mode, page, q);
            $("list").innerHTML =
              cs
                .map(
                  (c) =>
                    `<div class="list-row"><div style="flex:1;min-width:220px"><span class="muted" style="font-size:.85rem"><b>${esc(c.profiles?.display_name || "Ẩn danh")}</b> · <a href="../stories/detail.html?id=${c.story_id}">${esc(c.stories?.title || "")}</a>${c.chapters?.number ? " · chương " + c.chapters.number : ""} · ${fmtDate(c.created_at)}</span>${c.hidden_reason ? `<span class="muted" style="font-size:.8rem;color:var(--danger,#c0392b)">${esc(c.hidden_reason)}</span>` : ""}<p style="white-space:pre-wrap;word-break:break-word">${esc(c.body)}</p></div><span class="row"><button class="btn sm ghost" data-id="${c.id}" data-act="${c.is_hidden ? "show" : "hide"}">${c.is_hidden ? "Hiện lại" : "Ẩn"}</button><button class="btn sm danger" data-id="${c.id}" data-act="del">Xóa</button>${
                      c.profiles?.role === "admin"
                        ? ""
                        : `<button class="btn sm ${c.profiles?.is_locked ? "ghost" : "danger"}" data-uid="${c.user_id}" data-act="${c.profiles?.is_locked ? "unlock" : "lock"}" data-name="${esc(c.profiles?.display_name || "Ẩn danh")}">${c.profiles?.is_locked ? "Mở khóa TK" : "Khóa TK"}</button>`
                    }</span></div>`,
                )
                .join("") || emptyHTML("Không có bình luận.");
            $("pn").textContent = "Trang " + (page + 1);
            $("prev").disabled = page === 0;
            $("next").disabled = cs.length < API.PAGE;
            $("pg").hidden = false;
          } catch (e) {
            showError($("list"), e);
          }
        }
        $("tabs").onclick = (e) => {
          const b = e.target.closest("button[data-h]");
          if (!b) return;
          mode = b.dataset.h;
          page = 0;
          document.querySelectorAll("#tabs button").forEach((x) => x.classList.toggle("on", x === b));
          load();
        };
        let t;
        $("q").oninput = () => {
          clearTimeout(t);
          t = setTimeout(() => {
            q = $("q").value;
            page = 0;
            load();
          }, 400);
        };
        $("list").onclick = async (e) => {
          const b = e.target.closest("button[data-id],button[data-uid]");
          if (!b) return;
          if (b.dataset.uid) {
            const lock = b.dataset.act === "lock";
            let reason = null;
            if (lock) {
              reason = prompt(`Khóa tài khoản "${b.dataset.name}"? Người này sẽ không bình luận, đánh giá hay đăng bài được nữa.\nLý do (không bắt buộc):`);
              if (reason === null) return;
            } else if (!confirm(`Mở khóa tài khoản "${b.dataset.name}"?`)) return;
            b.disabled = true;
            try {
              await API.setUserLocked(b.dataset.uid, lock, reason ? reason.trim() : null);
              load();
            } catch (err) {
              showMsg($("m"), err.message);
              b.disabled = false;
            }
            return;
          }
          const id = +b.dataset.id,
            act = b.dataset.act;
          if (act === "del" && !confirm("Xóa vĩnh viễn bình luận này?")) return;
          b.disabled = true;
          try {
            if (act === "del") await API.deleteComment(id);
            else await API.hideComment(id, act === "hide");
            load();
          } catch (err) {
            showMsg($("m"), err.message);
            b.disabled = false;
          }
        };
        $("prev").onclick = () => {
          page--;
          load();
        };
        $("next").onclick = () => {
          page++;
          load();
        };
        load();
      })();
    </script>
  </body>
</html>
