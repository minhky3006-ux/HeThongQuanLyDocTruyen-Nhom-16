<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#46B07A" />
    <link rel="manifest" href="../../manifest.json" />
    <link rel="apple-touch-icon" href="../../assets/img/icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="TruyệnXanh" />
    <title>Thống kê thành viên · TruyệnXanh</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="../../assets/css/style.css" />
  </head>
  <body data-page="admin" data-root="../../">
    <main class="container">
      <h1 style="margin-top: 20px">Thống kê thành viên &amp; gói</h1>
      <div id="gate"></div>
      <div id="app" hidden>
        <form class="row" id="f" style="margin: 12px 0; align-items: flex-end">
          <div class="field"><label for="from">Từ ngày</label><input id="from" class="input" type="date" required /></div>
          <div class="field"><label for="to">Đến ngày</label><input id="to" class="input" type="date" required /></div>
          <div class="field"><label for="g">Nhóm theo</label><select id="g" class="input"><option value="day">Ngày</option><option value="month">Tháng</option></select></div>
          <button class="btn">Xem</button>
        </form>
        <p class="msg" id="m" hidden role="alert"></p>
        <div class="stat-grid" id="tot"></div>
        <h2>Diễn biến theo thời gian</h2>
        <div class="card" id="series"></div>
        <h2>Theo gói</h2>
        <div class="card" id="plans"></div>
        <p class="muted" style="font-size: 0.85rem; margin-top: 8px">
          Đăng ký mới = lần mua đầu tiên của một người với một loại gói; gia hạn = các lần mua sau của cùng người, cùng gói.
        </p>
      </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../assets/js/config.js"></script>
    <script src="../../assets/js/api.js"></script>
    <script src="../../assets/js/ui.js"></script>
    <script src="../../assets/js/layout.js"></script>
    <script src="../../assets/js/admin.js"></script>
    <script>
      (async () => {
        if (!(await requireAdmin("members"))) return;
        $("app").hidden = false;
        const iso = (d) => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
        const today = new Date();
        $("to").value = iso(today);
        $("from").value = iso(new Date(today.getTime() - 29 * 864e5));
        const card = (n, t) => `<div class="card"><b>${n}</b>${t}</div>`;
        async function load() {
          $("m").hidden = true;
          try {
            const r = await API.adminMemberStats($("from").value, $("to").value, $("g").value);
            const t = r.totals;
            $("tot").innerHTML =
              card(t.members, "Thành viên") + card(t.authors, "Tác giả") + card(t.locked, "Tài khoản bị khóa") + card(t.restricted, "Đang bị hạn chế") +
              card(t.active_subscribers, "Đang dùng gói") + card(t.new_members, "Thành viên mới (kỳ này)") + card(t.new_subs, "Đăng ký gói mới (kỳ này)") + card(t.renewals, "Gia hạn (kỳ này)");
            const max = Math.max(1, ...r.series.map((x) => Math.max(x.new_members, x.new_subs, x.renewals)));
            const bar = (v, c) => `<div style="display:flex;align-items:center;gap:6px"><div class="bar" style="width:${Math.round((v / max) * 100)}%;${c ? "background:" + c : ""}"></div><span class="muted" style="font-size:.8rem">${v}</span></div>`;
            const lab = (p) => (r.range.group === "month" ? p.slice(0, 7) : fmtDay(p));
            $("series").innerHTML =
              r.series.map((x) => `<div class="list-row" style="align-items:flex-start"><span style="min-width:90px"><b>${lab(x.period)}</b></span><span style="flex:1;min-width:200px">${bar(x.new_members)}${bar(x.new_subs, "#2f80ed")}${bar(x.renewals, "#f2994a")}</span></div>`).join("") +
              `<p class="muted" style="font-size:.85rem;margin-top:8px"><span class="bar" style="display:inline-block;width:18px"></span> Thành viên mới · <span class="bar" style="display:inline-block;width:18px;background:#2f80ed"></span> Đăng ký gói mới · <span class="bar" style="display:inline-block;width:18px;background:#f2994a"></span> Gia hạn</p>`;
            $("plans").innerHTML =
              r.by_plan.map((p) => `<div class="list-row"><span><strong>${esc(p.name)}</strong>${p.is_active ? "" : ' <span class="badge warn">Ngừng bán</span>'}</span><span class="muted">${p.active_users} đang dùng · ${p.new_subs} mới · ${p.renewals} gia hạn</span></div>`).join("") || emptyHTML("Chưa có gói nào.");
          } catch (e) {
            showMsg($("m"), e.message);
          }
        }
        $("f").onsubmit = (e) => {
          e.preventDefault();
          load();
        };
        load();
      })();
    </script>
  </body>
</html>
